name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript, tests and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Frontend build
        run: npm run build

  rust:
    name: Rust / Tauri tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and test output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
