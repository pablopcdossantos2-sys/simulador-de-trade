name: Build Windows installer and portable executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer and portable executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri and NSIS installer
        run: npx tauri build

      - name: Prepare portable executable and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "release-output"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under src-tauri/target/release/bundle/nsis."
          }

          $portable = "src-tauri/target/release/simulador-de-trade.exe"
          if (-not (Test-Path $portable)) {
            throw "Portable executable not found at $portable."
          }

          Copy-Item $installer.FullName (Join-Path $output "Simulador-de-Trade-Instalador.exe")
          Copy-Item $portable (Join-Path $output "Simulador-de-Trade-Portable.exe")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simulador-de-trade-windows-x64
          path: release-output/*.exe
          if-no-files-found: error
          retention-days: 30
