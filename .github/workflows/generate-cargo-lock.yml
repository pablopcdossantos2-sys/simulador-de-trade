name: Generate Cargo lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-cargo-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit Cargo lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if (git diff --cached --quiet) {
            Write-Output "Cargo.lock ja esta atualizado."
            exit 0
          }
          git commit -m "build: add reproducible Cargo lockfile"
          git push origin HEAD:main
