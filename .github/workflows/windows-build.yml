name: Windows packaging (on demand)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer and portable executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-windows-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-build-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri and NSIS installer
        env:
          VITE_BUILD_COMMIT_SHA: ${{ github.sha }}
        run: npm run tauri build

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $portable = "src-tauri/target/release/simulador-de-trade.exe"
          if (-not (Test-Path $portable)) { throw "Executável portátil não encontrado: $portable" }
          Copy-Item $portable "artifacts/Simulador-de-Trade-Portable.exe"

      - name: Copy NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Instalador NSIS não encontrado."
          }
          Copy-Item $installer.FullName "artifacts/Simulador-de-Trade-Instalador.exe"

      - name: Identify source revision
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Set-Content -Encoding utf8 "artifacts/BUILD-INFO.txt"
          "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content -Encoding utf8 "artifacts/BUILD-INFO.txt"
          "Branch or ref: $env:GITHUB_REF" | Add-Content -Encoding utf8 "artifacts/BUILD-INFO.txt"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii "artifacts/SHA256SUMS.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simulador-de-trade-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
